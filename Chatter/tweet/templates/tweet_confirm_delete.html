
{% extends 'layout.html' %}

{% block title %}
Chatter | Delete Tweet
{% endblock %}

{% block content %}

<div class="delete-page">

    <div class="delete-card">

        <div class="delete-icon">
            🗑️
        </div>

        <h1>Delete Tweet?</h1>

        <p>
            Are you sure you want to delete this tweet?
            This action cannot be undone.
        </p>

        <div class="delete-tweet-preview">
            <p>
                "{{ tweet.text }}"
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="delete-actions">

                <button type="submit" class="delete-btn">
                    Delete Tweet
                </button>

                <a href="{% url 'tweet_list' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
```
