
{% extends "layout.html" %}

{% block title %}
Chatter | Login
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h2>Welcome Back 👋</h2>

        <p class="login-subtitle">
            Login to continue to Chatter
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="{% url 'register' %}">
                Register here
            </a>
        </p>

    </div>

</div>

{% endblock %}
