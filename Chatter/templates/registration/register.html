
{% extends "layout.html" %}

{% block title %}
Chatter | Register
{% endblock %}

{% block content %}

<div class="register-page">

    <div class="register-card">

        <h2>Create Account 🚀</h2>

        <p class="register-subtitle">
            Join Chatter and start sharing your thoughts
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="{% url 'login' %}">
                Login here
            </a>
        </p>

    </div>

</div>

{% endblock %}
